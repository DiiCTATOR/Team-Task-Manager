<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task Manager | Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="glass-panel auth-panel">
        <h1 class="logo">Matrix<span>Tasks</span></h1>
        <div class="tab-group">
          <button id="tab-login" class="active">Login</button>
          <button id="tab-register">Register</button>
        </div>
        <form id="auth-form">
          <div id="register-fields" style="display: none;">
            <div class="input-group">
              <label>Name</label>
              <input type="text" id="auth-name" placeholder="John Doe">
            </div>
            <div class="input-group">
              <label>Role</label>
              <select id="auth-role">
                <option value="Member">Member</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="auth-email" placeholder="john@example.com" required>
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-primary" id="auth-submit">Login</button>
          <p id="auth-error" class="error-msg"></p>
        </form>
      </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-screen" class="screen" style="display: none;">
      <nav class="sidebar glass-panel">
        <h2 class="logo">Matrix<span>Tasks</span></h2>
        <div class="user-info">
          <div class="avatar" id="user-avatar">A</div>
          <div>
            <p id="user-name-display" class="user-name">User Name</p>
            <p id="user-role-display" class="user-role">Role</p>
          </div>
        </div>
        <ul class="nav-links">
          <li><a href="#" class="active" id="nav-dashboard">Dashboard</a></li>
          <li><a href="#" id="nav-projects">Projects</a></li>
          <li><a href="#" id="nav-tasks">Tasks</a></li>
        </ul>
        <button id="logout-btn" class="btn-outline">Logout</button>
      </nav>

      <main class="main-content">
        <header>
          <h1 id="page-title">Dashboard</h1>
          <button id="create-new-btn" class="btn-primary admin-only">+ Create New</button>
        </header>
        
        <div id="content-area">
          <!-- Dynamic Content Loads Here -->
        </div>
      </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
      <div class="modal glass-panel">
        <div class="modal-header">
          <h2 id="modal-title">Create</h2>
          <button id="close-modal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Forms load here -->
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
